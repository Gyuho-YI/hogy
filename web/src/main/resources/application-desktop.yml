# 데스크톱 프로그램 모드(Cockpit.exe). 데이터는 사용자 폴더에 저장 → 프로그램 폴더를 새 버전으로 교체해도 유지
app:
  data-dir: ${user.home}/Cockpit/output
  desktop: true
  open-browser: true
  batch-enabled: true

spring:
  datasource:
    url: jdbc:h2:file:${user.home}/Cockpit/data/journal

server:
  address: 127.0.0.1      # 이 PC 에서만 접속 가능
  port: 18080

logging:
  file:
    name: ${user.home}/Cockpit/logs/cockpit.log
