<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments :: head('로그인')}"></head>
<body>
<main class="auth">
  <div class="auth-card">
    <p class="auth-brand">Cockpit</p>
    <h1>로그인</h1>
    <p class="lead">개인 전용 매매 계획 대시보드</p>
    <form th:action="@{/login}" method="post">
      <p th:if="${param.error}" class="notice crit" role="alert">아이디 또는 비밀번호가 올바르지 않습니다</p>
      <p th:if="${param.logout}" class="notice ok">로그아웃되었습니다</p>
      <p th:if="${param.setup}" class="notice ok">비밀번호를 설정했습니다. 로그인하세요</p>
      <label class="field">아이디 <input name="username" autocomplete="username" required autofocus></label>
      <label class="field">비밀번호 <input name="password" type="password" autocomplete="current-password" required></label>
      <label class="check"><input type="checkbox" name="remember-me" checked> 30일간 로그인 유지</label>
      <button type="submit" class="btn pri block">로그인</button>
    </form>
  </div>
</main>
</body>
</html>
