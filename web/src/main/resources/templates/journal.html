<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments :: head('매매일지')}"></head>
<body th:attr="data-market=${market},data-decimals=${decimals}">
<header th:replace="~{fragments :: nav('journal')}"></header>

<main class="wrap">
  <div class="pagehead">
    <div>
      <p class="eyebrow" th:text="${market == 'kr'} ? 'KRX' : 'US Equities'">시장</p>
      <h1>매매일지</h1>
      <p class="meta"><span>보유 <b th:text="${open.size()}">0</b></span><span>청산 <b th:text="${stats.samples}">0</b></span></p>
    </div>
    <div class="pagehead-r">
      <a th:href="@{/journal/export.csv}" class="btn">켈리 CSV</a>
      <div th:replace="~{fragments :: market('journal')}"></div>
    </div>
  </div>

  <!-- ① 실전 통계 5 -->
  <section class="kpis" aria-label="실전 통계">
    <article class="kpi"><h2 class="kpi-k">기대값</h2>
      <p class="kpi-v" th:text="${stats.expectancy != null} ? ${#numbers.formatDecimal(stats.expectancy * 100, 1, 2)} + '%' : '–'">–</p>
      <p class="kpi-s">거래당 평균 수익률</p></article>
    <article class="kpi"><h2 class="kpi-k">승률</h2>
      <p class="kpi-v" th:text="${stats.winRate != null} ? ${#numbers.formatDecimal(stats.winRate * 100, 1, 1)} + '%' : '–'">–</p>
      <p class="kpi-s" th:text="${stats.winRateLower != null} ? '하한 ' + ${#numbers.formatDecimal(stats.winRateLower * 100, 1, 1)} + '% (Wilson)' : '–'">–</p></article>
    <article class="kpi"><h2 class="kpi-k">손익비</h2>
      <p class="kpi-v" th:text="${stats.payoff != null} ? ${#numbers.formatDecimal(stats.payoff, 1, 2)} : '–'">–</p>
      <p class="kpi-s">평균 수익 ÷ 평균 손실</p></article>
    <article class="kpi"><h2 class="kpi-k">하프 켈리</h2>
      <p class="kpi-v" th:text="${stats.halfKelly != null} ? ${#numbers.formatDecimal(stats.halfKelly * 100, 1, 2)} + '%' : '–'">–</p>
      <p class="kpi-s" th:text="${stats.note}">–</p></article>
    <article class="kpi"><h2 class="kpi-k">청산 건수</h2>
      <p class="kpi-v" th:text="${stats.samples}">0</p>
      <p class="kpi-s">켈리 적용 30건부터</p></article>
  </section>

  <div class="split">
    <div class="stack">
      <!-- ② 보유 중 -->
      <section class="panel">
        <div class="panel-h"><h2 class="panel-t">보유 중<em th:text="${open.size()}">0</em></h2></div>
        <div class="empty" th:if="${open.isEmpty()}"><b>보유 포지션 없음</b></div>
        <div class="tbl-wrap" th:unless="${open.isEmpty()}">
          <table class="tbl">
            <thead><tr><th>종목</th><th class="num">진입</th><th class="num">손절</th><th class="num hide-sm">목표 1 · 2</th><th>청산</th></tr></thead>
            <tbody>
            <tr th:each="t : ${open}">
              <td><span class="nm" th:text="${t.name ?: t.code}"></span>
                <span class="sub" th:text="${t.code + ' · ' + t.strategy.label() + ' · ' + #temporals.format(t.entryDate, 'yyyy-MM-dd')}"></span></td>
              <td class="num"><span th:text="${#numbers.formatDecimal(t.entryPrice, 1, 'COMMA', decimals, 'POINT')}"></span>
                <span class="sub" th:text="${t.quantity} + '주'"></span></td>
              <td class="num down" th:text="${t.stopPrice != null} ? ${#numbers.formatDecimal(t.stopPrice, 1, 'COMMA', decimals, 'POINT')} : '–'"></td>
              <td class="num hide-sm"><span th:text="${t.target1 != null} ? ${#numbers.formatDecimal(t.target1, 1, 'COMMA', decimals, 'POINT')} : '–'"></span>
                <span class="sub" th:text="${t.target2 != null} ? ${#numbers.formatDecimal(t.target2, 1, 'COMMA', decimals, 'POINT')} : ''"></span></td>
              <td>
                <form class="inline" th:action="@{/journal/{m}/{id}/close(m=${market},id=${t.id})}" method="post">
                  <input type="date" name="exitDate" th:value="${today}" required aria-label="청산일">
                  <input type="number" name="exitPrice" step="any" min="0" required placeholder="청산가" aria-label="청산가">
                  <button type="submit" class="btn sm pri">청산</button>
                </form>
                <form class="inline" th:action="@{/journal/{m}/{id}/delete(m=${market},id=${t.id})}" method="post"
                      onsubmit="return confirm('이 기록을 삭제할까요?')">
                  <button type="submit" class="btn ghost sm">삭제</button>
                </form>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- ③ 매수 기록 -->
      <section class="panel">
        <div class="panel-h"><h2 class="panel-t">매수 기록</h2></div>
        <div class="panel-b">
          <form class="form" th:action="@{/journal/{m}(m=${market})}" th:object="${form}" method="post">
            <label class="field">종목코드 <input th:field="*{code}" required></label>
            <label class="field">종목명 <input th:field="*{name}"></label>
            <label class="field">전략
              <select th:field="*{strategy}">
                <option th:each="s : ${strategies}" th:value="${s}" th:text="${s.label()}"></option>
              </select>
            </label>
            <label class="field">매수일 <input type="date" th:field="*{entryDate}" required></label>
            <label class="field">매수가 <input type="number" step="any" min="0" th:field="*{entryPrice}" required></label>
            <label class="field">수량 <input type="number" min="1" th:field="*{quantity}" required></label>
            <label class="field">손절가 <input type="number" step="any" min="0" th:field="*{stopPrice}"></label>
            <label class="field">목표 1 <input type="number" step="any" min="0" th:field="*{target1}"></label>
            <label class="field">목표 2 <input type="number" step="any" min="0" th:field="*{target2}"></label>
            <label class="field wide">메모 <input th:field="*{memo}" placeholder="진입 근거 · 테마 · 수급"></label>
            <p class="err wide" th:if="${#fields.hasErrors('*')}">필수 항목(종목코드 · 매수가 · 수량)을 확인하세요.</p>
            <div class="wide"><button type="submit" class="btn pri">기록</button></div>
          </form>
        </div>
      </section>
    </div>

    <div class="stack">
      <!-- ④ 월별 손익 -->
      <section class="panel">
        <div class="panel-h"><div><h2 class="panel-t">월별 실현손익</h2><p class="panel-s" th:text="${market == 'kr'} ? '원' : 'USD'">원</p></div></div>
        <div class="panel-b"><div class="chart h-md" id="monthly-chart" role="img" aria-label="월별 실현손익"></div></div>
        <div class="tbl-wrap" th:unless="${monthly.isEmpty()}">
          <table class="tbl">
            <thead><tr><th>월</th><th class="num">손익</th><th class="num">건수</th><th class="num">전월 대비</th></tr></thead>
            <tbody>
            <tr th:each="mp : ${monthly}">
              <td th:text="${mp.month}"></td>
              <td class="num" th:classappend="${mp.pnl >= 0} ? 'up' : 'down'" th:text="${#numbers.formatDecimal(mp.pnl, 1, 'COMMA', decimals, 'POINT')}"></td>
              <td class="num" th:text="${mp.trades}"></td>
              <td class="num" th:text="${mp.momRate != null} ? ${#numbers.formatDecimal(mp.momRate * 100, 1, 1)} + '%' : ${mp.momLabel}"></td>
            </tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- ⑤ 최근 청산 -->
      <section class="panel">
        <div class="panel-h"><h2 class="panel-t">최근 청산</h2></div>
        <div class="empty" th:if="${closed.isEmpty()}"><b>청산 기록 없음</b></div>
        <ul class="rows" th:unless="${closed.isEmpty()}">
          <li th:each="t, st : ${closed}" th:if="${st.index < 15}">
            <span class="grow"><b th:text="${t.name ?: t.code}"></b></span>
            <span class="m" th:text="${#temporals.format(t.exitDate, 'yyyy-MM-dd')}"></span>
            <span class="r" th:classappend="${t.returnRate() >= 0} ? 'up' : 'down'"
                  th:text="(${t.returnRate() >= 0} ? '+' : '−') + ${#numbers.formatDecimal(t.returnRate() < 0 ? -t.returnRate() * 100 : t.returnRate() * 100, 1, 2)} + '%'"></span>
          </li>
        </ul>
      </section>
    </div>
  </div>
</main>

<script th:src="@{/js/vendor/ztd-charts.min.js}"></script>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/journal.js}"></script>
</body>
</html>
