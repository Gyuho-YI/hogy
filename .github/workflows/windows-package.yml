# Windows 데스크톱 패키지 빌드: Cockpit.exe(Java 런타임 포함) + screener.exe(Python 포함) → ZIP
# - 브랜치 push / 수동 실행: Actions 탭의 실행 결과 하단 'Artifacts'에서 ZIP 다운로드
# - v* 태그 push 또는 수동 실행 시 release_tag 입력: GitHub Releases 에 ZIP 영구 첨부
name: windows-package

on:
  push:
    branches: [master, claude/stock-screening-ai-strategy-vae6o1]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Releases 에 영구 등록할 태그(예: v0.1.0). 비우면 빌드만"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - name: 웹앱 테스트
        run: cd web && ./mvnw -B test
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - name: 스크리너 문법·의존성 점검
        run: |
          pip install -r requirements.txt
          python -m py_compile screener/*.py
          pip install pytest
          python -m pytest -q screener/tests
          cd screener && python cli.py check

  package:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }

      - name: 웹앱 JAR 빌드
        run: |
          cd web
          ./mvnw.cmd -B -DskipTests package

      - name: screener.exe 빌드 (PyInstaller)
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --onedir --name screener `
            --paths screener `
            --collect-all pykrx --collect-all yfinance --collect-all curl_cffi `
            --distpath build/pyi --workpath build/pyi-work --specpath build `
            screener/cli.py
          ./build/pyi/screener/screener.exe check
          if ($LASTEXITCODE -ne 0) { throw "screener.exe 자가 진단 실패" }

      - name: Cockpit.exe 빌드 (jpackage, Java 런타임 포함)
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          # 앱 버전: 태그(v1.2.3)에서 추출, 형식이 아니면 0.1.0
          $ver = $env:TAG -replace '^v', ''
          if ($ver -notmatch '^\d+(\.\d+){0,2}$') { $ver = '0.1.0' }
          New-Item -ItemType Directory -Force build/jin | Out-Null
          Copy-Item web/target/cockpit-0.1.0.jar build/jin/cockpit.jar
          jpackage --type app-image --name Cockpit `
            --input build/jin --main-jar cockpit.jar `
            --dest build/app --app-version $ver --vendor hogy `
            --java-options "-Dcockpit.desktop=true" `
            --java-options "-Dfile.encoding=UTF-8" `
            --java-options "-Xmx512m"
          Copy-Item -Recurse build/pyi/screener build/app/Cockpit/screener
          Copy-Item "packaging/README-실행방법.txt" build/app/Cockpit/

      - name: 실행 스모크 테스트 (기동 → 최초설정 화면 응답 → 종료)
        run: |
          $p = Start-Process -FilePath build/app/Cockpit/Cockpit.exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri http://localhost:18080/setup -UseBasicParsing -TimeoutSec 3
              if ($r.StatusCode -eq 200 -and $r.Content -match "Cockpit") { $ok = $true; break }
            } catch { }
          }
          Get-ChildItem "$env:USERPROFILE/Cockpit/logs" -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 40 }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process java*, Cockpit* -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "Cockpit.exe 기동 확인 실패" }

      - name: 해외 스크리너·섹터 레이더 실데이터 점검 (네트워크 의존 → 실패해도 빌드 유지)
        continue-on-error: true
        run: |
          # 기본 유니버스(약 130종목) 그대로 실행 → 사용자 PC 와 같은 조건의 단계별 통과 수 확인
          ./build/app/Cockpit/screener/screener.exe us --account 20000 --out build/smoke
          python -c "import json; d=json.load(open('build/smoke/plans_us.json', encoding='utf-8')); print('STATS', d['stats']); [print(i['code'], i['action'], i['notes'][-1] if i['notes'] else '') for i in d['items']]"
          Get-Content build/smoke/sectors_us.json -TotalCount 40

      - name: ZIP 압축
        run: Compress-Archive -Path build/app/Cockpit -DestinationPath Cockpit-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Cockpit-windows
          path: Cockpit-windows.zip
          retention-days: 30

      - name: 릴리스 영구 등록 (v* 태그 또는 release_tag 입력)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Cockpit ${{ inputs.release_tag || github.ref_name }} (Windows)
          body: |
            ## 설치 없이 실행
            1. 아래 **Cockpit-windows.zip** 다운로드 → 압축 해제
            2. `Cockpit.exe` 더블클릭 (SmartScreen 경고 시 [추가 정보] → [실행])
            3. 브라우저에서 비밀번호 설정(아이디 owner) → [설정]에서 계좌 금액 입력 → [지금 실행]

            자세한 사용법은 ZIP 안의 `README-실행방법.txt` 참고.
            매매 '추천' 도구이며 주문을 실행하지 않습니다.
          files: Cockpit-windows.zip
